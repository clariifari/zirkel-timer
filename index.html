<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Zirkel Timer</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Zirkel">
<meta name="theme-color" content="#e2482c">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
body{margin:0;overscroll-behavior:none}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-screen app. Setup = stacked stepper rows like a gym scoreboard panel; run = full-bleed phase color with a giant clock. */
:root {
  --bg: #f3f4f1;
  --surface: #ffffff;
  --fg: #16181a;
  --muted: #646a6f;
  --line: #dfe2dd;
  --accent: #e2482c;
  --work: #e2482c;
  --rest: #23826f;
  --round: #3557c9;
  --prep: #565c63;
  --on-phase: #ffffff;
  --display: "Big Shoulders Display", "Arial Narrow", "Helvetica Neue", sans-serif;
  --body: "Figtree", -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121416; --surface: #1c1f22; --fg: #eef0ee; --muted: #9aa1a6; --line: #2c3034;
    --accent: #f05a3e; --work: #d8432a; --rest: #1f7564; --round: #3352b8; --prep: #3d4247;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121416; --surface: #1c1f22; --fg: #eef0ee; --muted: #9aa1a6; --line: #2c3034;
  --accent: #f05a3e; --work: #d8432a; --rest: #1f7564; --round: #3352b8; --prep: #3d4247;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px;
  -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- Setup ---------- */
#setup {
  max-width: 480px; margin: 0 auto; min-height: 100%;
  display: flex; flex-direction: column; gap: 20px;
  padding-block: 20px 28px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.brand h1 { font-family: var(--display); font-weight: 800; font-size: 44px; line-height: 1; margin: 0; letter-spacing: .01em; text-transform: uppercase; }
.brand h1 span { color: var(--accent); }
.brand small { color: var(--muted); font-size: 13px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.row + .row { border-top: 1px solid var(--line); }
.row .lbl { flex: 1; min-width: 0; }
.row .lbl b { display: block; font-weight: 600; font-size: 16px; }
.row .lbl i { display: block; font-style: normal; color: var(--muted); font-size: 13px; margin-top: 2px; }
.step { display: flex; align-items: center; gap: 6px; }
.step button {
  width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
  background: var(--bg); font-size: 24px; line-height: 1; display: grid; place-items: center;
}
.step button:active { background: var(--line); }
.step output {
  min-width: 74px; text-align: center; font-family: var(--display); font-weight: 800;
  font-size: 30px; font-variant-numeric: tabular-nums; line-height: 1;
}
.step output small { font-family: var(--body); font-size: 13px; font-weight: 600; color: var(--muted); margin-left: 2px; }
.sum { display: flex; justify-content: space-between; align-items: baseline; color: var(--muted); font-size: 14px; padding: 0 4px; }
.sum strong { color: var(--fg); font-family: var(--display); font-weight: 800; font-size: 28px; font-variant-numeric: tabular-nums; }
.go {
  margin-top: auto; width: 100%; height: 64px; border: 0; border-radius: 14px;
  background: var(--accent); color: #fff; font-family: var(--display); font-weight: 800;
  font-size: 30px; letter-spacing: .06em; text-transform: uppercase;
}
.go:active { filter: brightness(.92); }

/* ---------- Run ---------- */
#run {
  position: fixed; inset: 0; z-index: 5; background: var(--prep); color: var(--on-phase);
  display: flex; flex-direction: column;
  padding-top: calc(env(safe-area-inset-top, 0px) + 16px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  transition: background-color .35s ease;
}
#run.work { background: var(--work); }
#run.rest { background: var(--rest); }
#run.round { background: var(--round); }
#run.prep { background: var(--prep); }
.top { display: flex; gap: 10px; }
.chip {
  flex: 1; background: rgba(0,0,0,.18); border-radius: 12px; padding: 10px 12px;
  display: flex; flex-direction: column; gap: 2px;
}
.chip span { font-size: 12px; text-transform: uppercase; letter-spacing: .1em; opacity: .8; }
.chip b { font-family: var(--display); font-weight: 800; font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums; }
.chip b em { font-style: normal; opacity: .6; font-size: 22px; }
.center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; min-height: 0; }
#phase { font-family: var(--display); font-weight: 800; font-size: clamp(34px, 11vw, 64px); text-transform: uppercase; letter-spacing: .05em; line-height: 1; text-align: center; }
#clock { font-family: var(--display); font-weight: 800; font-size: clamp(120px, 46vw, 280px); line-height: .9; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
#run.last3 #clock { animation: pulse 1s ease-out infinite; }
@keyframes pulse { 0% { transform: scale(1.06); } 100% { transform: scale(1); } }
@media (prefers-reduced-motion: reduce) { #run.last3 #clock { animation: none; } #run { transition: none; } }
#next { font-size: 17px; opacity: .9; text-align: center; min-height: 1.3em; }
.bar { height: 8px; background: rgba(0,0,0,.2); border-radius: 4px; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--on-phase); border-radius: 4px; }
.total { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; }
.total div { display: flex; justify-content: space-between; font-size: 14px; opacity: .9; font-variant-numeric: tabular-nums; }
.ctrl { display: grid; grid-template-columns: 1fr 1.6fr 1fr; gap: 10px; }
.ctrl button {
  height: 60px; border: 0; border-radius: 14px; background: rgba(0,0,0,.22);
  color: var(--on-phase); font-weight: 700; font-size: 16px;
}
.ctrl button.main { background: var(--on-phase); color: #16181a; font-size: 18px; }
.ctrl button:active { filter: brightness(.9); }
.ctrl button.armed { background: #16181a; }

/* ---------- Done ---------- */
#done { text-align: center; }
#done .center { gap: 14px; }
#done h2 { font-family: var(--display); font-weight: 800; font-size: clamp(56px, 18vw, 110px); line-height: .9; margin: 0; text-transform: uppercase; }
#done p { margin: 0; font-size: 18px; opacity: .92; }
</style>

</head>
<body>
<main id="setup">
  <div class="brand">
    <h1>Zirkel<span>.</span></h1>
    <small>Einstellungen werden gemerkt</small>
  </div>

  <div class="panel" id="fields"></div>

  <div class="sum">
    <span id="sumDetail">Gesamtdauer</span>
    <strong id="sumTotal">0:00</strong>
  </div>

  <button class="go" id="startBtn">Start</button>
</main>

<section id="run" hidden>
  <div class="top">
    <div class="chip"><span>Runde</span><b id="rRound">1<em>/3</em></b></div>
    <div class="chip"><span>Übung</span><b id="rEx">1<em>/8</em></b></div>
  </div>
  <div class="center">
    <div id="phase">Bereit</div>
    <div id="clock">5</div>
    <div id="next"></div>
  </div>
  <div class="total">
    <div class="bar"><i id="phaseBar"></i></div>
    <div><span>Noch gesamt <b id="left">0:00</b></span><span id="pct">0 %</span></div>
    <div class="bar"><i id="totalBar"></i></div>
  </div>
  <div class="ctrl">
    <button id="stopBtn">Stopp</button>
    <button id="pauseBtn" class="main">Pause</button>
    <button id="skipBtn">Weiter ›</button>
  </div>
</section>

<section id="done" hidden>
  <div class="center">
    <h2>Geschafft</h2>
    <p id="doneText"></p>
  </div>
  <div class="ctrl" style="grid-template-columns:1fr">
    <button class="main" id="backBtn">Zurück</button>
  </div>
</section>

<script>
(() => {
  const PREP = 5;
  const FIELDS = [
    { key: 'exercises', label: 'Übungen', hint: 'pro Runde', min: 1, max: 30, step: 1, unit: '' },
    { key: 'work', label: 'Übungszeit', hint: 'pro Übung', min: 1, max: 600, step: 1, unit: 's' },
    { key: 'rest', label: 'Pause', hint: 'zwischen den Übungen', min: 0, max: 300, step: 1, unit: 's' },
    { key: 'rounds', label: 'Runden', hint: 'Durchgänge', min: 1, max: 20, step: 1, unit: '' },
    { key: 'roundRest', label: 'Rundenpause', hint: 'zwischen den Runden', min: 0, max: 600, step: 1, unit: 's' },
    { key: 'lag', label: 'Ton-Ausgleich', hint: 'falls der Ton nach der Anzeige kommt', min: 0, max: 2, step: 0.1, unit: 'lag' },
  ];
  const DEFAULTS = { exercises: 8, work: 40, rest: 20, rounds: 3, roundRest: 60, lag: 1.0 };
  let cfg = { ...DEFAULTS };
  try { Object.assign(cfg, JSON.parse(localStorage.getItem('zirkel-cfg') || '{}')); } catch (e) {}
  const save = () => { try { localStorage.setItem('zirkel-cfg', JSON.stringify(cfg)); } catch (e) {} };

  const $ = id => document.getElementById(id);
  const mmss = s => { s = Math.max(0, Math.round(s)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };
  const fmtVal = (f, v) => f.unit === 'lag' ? `${v.toFixed(1)}<small>s</small>` : f.unit === 's'
    ? (v >= 60 ? `${mmss(v)}<small>min</small>` : `${v}<small>s</small>`)
    : `${v}`;

  // ---------- Setup UI ----------
  const fieldsEl = $('fields');
  FIELDS.forEach(f => {
    const row = document.createElement('div');
    row.className = 'row';
    row.innerHTML = `<div class="lbl"><b>${f.label}</b><i>${f.hint}</i></div>
      <div class="step">
        <button aria-label="${f.label} weniger" data-d="-1">−</button>
        <output id="v-${f.key}"></output>
        <button aria-label="${f.label} mehr" data-d="1">+</button>
      </div>`;
    row.querySelectorAll('button').forEach(b => {
      const d = +b.dataset.d;
      let n = 0;
      const bump = () => {
        const mult = f.unit === 's' && n > 12 ? 5 : 1;
        cfg[f.key] = Math.round(Math.min(f.max, Math.max(f.min, cfg[f.key] + d * f.step * mult)) * 10) / 10;
        renderSetup(); save();
      };
      let t1, t2;
      const stop = () => { clearTimeout(t1); clearInterval(t2); };
      b.addEventListener('pointerdown', e => { e.preventDefault(); n = 0; bump(); t1 = setTimeout(() => { t2 = setInterval(() => { n++; bump(); }, 90); }, 400); });
      ['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => b.addEventListener(ev, stop));
      b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); bump(); } });
    });
    fieldsEl.appendChild(row);
  });

  function buildPlan() {
    const p = [{ type: 'prep', dur: PREP, round: 1, ex: 1 }];
    for (let r = 1; r <= cfg.rounds; r++) {
      for (let e = 1; e <= cfg.exercises; e++) {
        p.push({ type: 'work', dur: cfg.work, round: r, ex: e });
        if (e < cfg.exercises && cfg.rest > 0) p.push({ type: 'rest', dur: cfg.rest, round: r, ex: e + 1 });
      }
      if (r < cfg.rounds && cfg.roundRest > 0) p.push({ type: 'round', dur: cfg.roundRest, round: r + 1, ex: 1 });
    }
    return p;
  }

  function renderSetup() {
    FIELDS.forEach(f => { $('v-' + f.key).innerHTML = fmtVal(f, cfg[f.key]); });
    const total = buildPlan().slice(1).reduce((a, s) => a + s.dur, 0);
    $('sumTotal').textContent = mmss(total);
    $('sumDetail').textContent = `Gesamtdauer · ${cfg.exercises * cfg.rounds} Sätze`;
  }
  renderSetup();

  // ---------- Audio track ----------
  // The whole workout is rendered into one audio file and played by an <audio> element.
  // Media playback ignores the silent switch and keeps running while the iPhone is locked.
  // The track's playback position is the clock for the display.
  const SR = 8000;
  function tone(buf, t0, freq, len, vol = 0.8) {
    const s0 = Math.floor(t0 * SR), n = Math.floor(len * SR);
    for (let i = 0; i < n && s0 + i < buf.length; i++) {
      const t = i / SR;
      const env = Math.min(1, t / 0.008) * Math.min(1, (len - t) / 0.04);
      const v = Math.sin(2 * Math.PI * freq * t) * 0.75 + Math.sin(4 * Math.PI * freq * t) * 0.25;
      buf[s0 + i] = Math.max(-1, Math.min(1, buf[s0 + i] + v * env * vol));
    }
  }
  const SOUNDS = {
    count: (b, t) => tone(b, t, 880, 0.12, 0.7),                                   // 3-2-1 vor Ende der Pause
    work: (b, t) => tone(b, t, 1318, 0.7, 0.85),                                    // hoch und lang: los geht's
    rest: (b, t) => { tone(b, t, 523, 0.22); tone(b, t + 0.26, 392, 0.4); },        // tief, fallend: Pause
    round: (b, t) => { tone(b, t, 523, 0.18); tone(b, t + 0.22, 440, 0.18); tone(b, t + 0.44, 349, 0.45); },
    done: (b, t) => [784, 988, 1175, 1568].forEach((f, i) => tone(b, t + i * 0.17, f, i === 3 ? 0.5 : 0.22)),
  };
  function renderTrack(p, total) {
    const len = total + 2;
    const buf = new Float32Array(Math.ceil(len * SR));
    p.forEach((s, i) => {
      if (i > 0 && SOUNDS[s.type]) SOUNDS[s.type](buf, s.start);
      if (s.type === 'work' && i > 0 && p[i - 1].type !== 'work') {
        for (let k = 1; k <= 3; k++) if (s.start - k >= p[i - 1].start + 0.3) SOUNDS.count(buf, s.start - k);
      }
    });
    SOUNDS.done(buf, total);
    const n = buf.length, ab = new ArrayBuffer(44 + n * 2), v = new DataView(ab);
    const w = (o, str) => { for (let i = 0; i < str.length; i++) v.setUint8(o + i, str.charCodeAt(i)); };
    w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVE'); w(12, 'fmt ');
    v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true);
    v.setUint32(24, SR, true); v.setUint32(28, SR * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true);
    w(36, 'data'); v.setUint32(40, n * 2, true);
    const pcm = new Int16Array(ab, 44, n);
    for (let i = 0; i < n; i++) pcm[i] = buf[i] * 32767;
    return URL.createObjectURL(new Blob([ab], { type: 'audio/wav' }));
  }
  const player = new Audio();
  player.setAttribute('playsinline', '');
  player.preload = 'auto';
  let trackUrl = null;

  // ---------- Keep the screen on ----------
  let lock = null;
  const keepVid = document.createElement('video');
  keepVid.setAttribute('playsinline', ''); keepVid.setAttribute('muted', '');
  keepVid.muted = true; keepVid.loop = true;
  keepVid.src = 'data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAAAMpbW9vdgAAAGxtdmhkAAAAAAAAAAAAAAAAAAAD6AAAB9AAAQAAAQAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAgAAAlN0cmFrAAAAXHRraGQAAAADAAAAAAAAAAAAAAABAAAAAAAAB9AAAAAAAAAAAAAAAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAABAAAAAAAAAAAAAAAAAABAAAAAABAAAAAQAAAAAAAkZWR0cwAAABxlbHN0AAAAAAAAAAEAAAfQAAAAAAABAAAAAAHLbWRpYQAAACBtZGhkAAAAAAAAAAAAAAAAAABAAAAAgABVxAAAAAAALWhkbHIAAAAAAAAAAHZpZGUAAAAAAAAAAAAAAABWaWRlb0hhbmRsZXIAAAABdm1pbmYAAAAUdm1oZAAAAAEAAAAAAAAAAAAAACRkaW5mAAAAHGRyZWYAAAAAAAAAAQAAAAx1cmwgAAAAAQAAATZzdGJsAAAAtnN0c2QAAAAAAAAAAQAAAKZhdmMxAAAAAAAAAAEAAAAAAAAAAAAAAAAAAAAAABAAEABIAAAASAAAAAAAAAABFUxhdmM2MC4zMS4xMDIgbGlieDI2NAAAAAAAAAAAAAAAGP//AAAALGF2Y0MBQsAK/+EAFWdCwAraewEQAAADABAAAAMAIPEiagEABGjOD8gAAAAQcGFzcAAAAAEAAAABAAAAFGJ0cnQAAAAAAAAKOAAACjgAAAAYc3R0cwAAAAAAAAABAAAAAgAAQAAAAAAUc3RzcwAAAAAAAAABAAAAAQAAABxzdHNjAAAAAAAAAAEAAAABAAAAAgAAAAEAAAAcc3RzegAAAAAAAAAAAAAAAgAAAoUAAAAJAAAAFHN0Y28AAAAAAAAAAQAAA1kAAABidWR0YQAAAFptZXRhAAAAAAAAACFoZGxyAAAAAAAAAABtZGlyYXBwbAAAAAAAAAAAAAAAAC1pbHN0AAAAJal0b28AAAAdZGF0YQAAAAEAAAAATGF2ZjYwLjE2LjEwMAAAAAhmcmVlAAAClm1kYXQAAAJvBgX//2vcRem95tlIt5Ys2CDZI+7veDI2NCAtIGNvcmUgMTY0IHIzMTA4IDMxZTE5ZjkgLSBILjI2NC9NUEVHLTQgQVZDIGNvZGVjIC0gQ29weWxlZnQgMjAwMy0yMDIzIC0gaHR0cDovL3d3dy52aWRlb2xhbi5vcmcveDI2NC5odG1sIC0gb3B0aW9uczogY2FiYWM9MCByZWY9MSBkZWJsb2NrPTE6MDowIGFuYWx5c2U9MHgxOjB4MTExIG1lPWhleCBzdWJtZT0yIHBzeT0xIHBzeV9yZD0xLjAwOjAuMDAgbWl4ZWRfcmVmPTAgbWVfcmFuZ2U9MTYgY2hyb21hX21lPTEgdHJlbGxpcz0wIDh4OGRjdD0wIGNxbT0wIGRlYWR6b25lPTIxLDExIGZhc3RfcHNraXA9MSBjaHJvbWFfcXBfb2Zmc2V0PTAgdGhyZWFkcz0xIGxvb2thaGVhZF90aHJlYWRzPTEgc2xpY2VkX3RocmVhZHM9MCBucj0wIGRlY2ltYXRlPTEgaW50ZXJsYWNlZD0wIGJsdXJheV9jb21wYXQ9MCBjb25zdHJhaW5lZF9pbnRyYT0wIGJmcmFtZXM9MCB3ZWlnaHRwPTAga2V5aW50PTI1MCBrZXlpbnRfbWluPTEgc2NlbmVjdXQ9NDAgaW50cmFfcmVmcmVzaD0wIHJjX2xvb2thaGVhZD0xMCByYz1jcmYgbWJ0cmVlPTEgY3JmPTIzLjAgcWNvbXA9MC42MCBxcG1pbj0wIHFwbWF4PTY5IHFwc3RlcD00IGlwX3JhdGlvPTEuNDAgYXE9MToxLjAwAIAAAAAOZYiEBb///w9FAAFPf4AAAAAFQZogFfU=';
  keepVid.style.cssText = 'position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:0;top:0';
  document.body.appendChild(keepVid);
  async function keepAwake() {
    try { keepVid.play().catch(() => {}); } catch (e) {}
    try { if ('wakeLock' in navigator && !lock) { lock = await navigator.wakeLock.request('screen'); lock.addEventListener('release', () => { lock = null; }); } } catch (e) {}
  }
  function releaseAwake() {
    try { keepVid.pause(); } catch (e) {}
    try { lock && lock.release(); } catch (e) {} lock = null;
  }
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && running) { keepAwake(); tick(); }
  });

  // ---------- Timer ----------
  const LABEL = { prep: 'Bereit machen', work: 'Übung', rest: 'Pause', round: 'Rundenpause' };
  let plan = [], total = 0, idx = -1, running = false, raf = 0, startedAt = 0, floorT = 0;
  const now = () => Math.max(floorT, player.currentTime - (cfg.lag || 0));
  const runEl = $('run');

  function show(view) {
    $('setup').hidden = view !== 'setup';
    runEl.hidden = view !== 'run';
    $('done').hidden = view !== 'done';
  }

  function nextText(i) {
    const n = plan[i + 1];
    if (!n) return 'Letzte Übung!';
    if (n.type === 'work') return `Als Nächstes: Übung ${n.ex}` + (plan[i].type === 'round' || plan[i].type === 'prep' ? ` · Runde ${n.round}` : '');
    if (n.type === 'rest') return `Danach: ${n.dur} s Pause`;
    if (n.type === 'round') return `Danach: Rundenpause ${mmss(n.dur)}`;
    return '';
  }
  const phaseName = s => s.type === 'work' ? `Übung ${s.ex}` : LABEL[s.type];

  function enter(i) {
    idx = i;
    const s = plan[i];
    runEl.className = s.type;
    $('phase').textContent = player.paused ? 'Pausiert' : phaseName(s);
    $('rRound').innerHTML = `${s.round}<em>/${cfg.rounds}</em>`;
    $('rEx').innerHTML = `${s.ex}<em>/${cfg.exercises}</em>`;
    $('next').textContent = nextText(i);
    if ('mediaSession' in navigator) {
      try { navigator.mediaSession.metadata = new MediaMetadata({ title: phaseName(s), artist: `Zirkel Timer · Runde ${s.round}/${cfg.rounds}`, artwork: [{ src: 'icon-512.png', sizes: '512x512', type: 'image/png' }] }); } catch (e) {}
    }
  }

  function draw(t) {
    let i = plan.findIndex(s => t < s.start + s.dur);
    if (i < 0) i = plan.length - 1;
    if (i !== idx) enter(i);
    const s = plan[i];
    const left = Math.min(s.dur, Math.max(0, s.start + s.dur - t));
    const secs = Math.ceil(left - 1e-6);
    $('clock').textContent = secs >= 60 ? mmss(secs) : secs;
    $('phaseBar').style.width = (100 * (1 - left / s.dur)).toFixed(2) + '%';
    const rem = Math.min(total, Math.max(0, total - t));
    $('left').textContent = mmss(rem);
    const pct = 100 * (1 - rem / total);
    $('totalBar').style.width = pct.toFixed(2) + '%';
    $('pct').textContent = Math.floor(pct) + ' %';
    runEl.classList.toggle('last3', secs <= 3 && secs > 0 && !player.paused);
  }

  function tick() {
    if (!running) return;
    const t = now();
    if (t >= total) return finish();
    draw(t);
  }
  function loop() {
    cancelAnimationFrame(raf);
    if (!running) return;
    tick();
    raf = requestAnimationFrame(loop);
  }

  function buildTimed() {
    const p = buildPlan();
    let t = 0;
    p.forEach(s => { s.start = t; t += s.dur; });
    return [p, t];
  }

  function start() {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    [plan, total] = buildTimed();
    if (trackUrl) URL.revokeObjectURL(trackUrl);
    trackUrl = renderTrack(plan, total);
    player.src = trackUrl;
    player.currentTime = 0;
    const pr = player.play();
    if (pr && pr.catch) pr.catch(() => {});
    running = true; startedAt = Date.now(); idx = -1; floorT = 0;
    $('pauseBtn').textContent = 'Pause';
    disarmStop();
    show('run');
    draw(0);
    keepAwake();
    loop();
  }

  function togglePause() {
    if (!running) return;
    if (player.paused) { player.play().catch(() => {}); keepAwake(); }
    else player.pause();
  }
  player.addEventListener('pause', () => {
    if (!running) return;
    $('pauseBtn').textContent = 'Weiter';
    $('phase').textContent = 'Pausiert';
    runEl.classList.remove('last3');
  });
  player.addEventListener('play', () => {
    if (!running) return;
    $('pauseBtn').textContent = 'Pause';
    if (idx >= 0) $('phase').textContent = phaseName(plan[idx]);
  });
  player.addEventListener('ended', () => { if (running) finish(); });

  function skip() {
    if (!running) return;
    const i = idx < 0 ? 0 : idx;
    if (i + 1 >= plan.length) return finish();
    floorT = plan[i + 1].start;
    player.currentTime = Math.max(0, plan[i + 1].start - 0.05);
    draw(floorT);
  }

  if ('mediaSession' in navigator) {
    try {
      navigator.mediaSession.setActionHandler('play', () => { player.play().catch(() => {}); });
      navigator.mediaSession.setActionHandler('pause', () => player.pause());
      navigator.mediaSession.setActionHandler('nexttrack', skip);
    } catch (e) {}
  }

  let armTimer;
  function disarmStop() { clearTimeout(armTimer); const b = $('stopBtn'); b.classList.remove('armed'); b.textContent = 'Stopp'; }
  function stopTap() {
    const b = $('stopBtn');
    if (!b.classList.contains('armed')) {
      b.classList.add('armed'); b.textContent = 'Sicher?';
      armTimer = setTimeout(disarmStop, 2500);
      return;
    }
    disarmStop(); halt(true); show('setup');
  }

  function halt(silence) {
    running = false; cancelAnimationFrame(raf); releaseAwake();
    if (silence) player.pause();
  }

  function finish() {
    if (!running) return;
    halt(false); // let the closing fanfare play out
    const mins = Math.round((Date.now() - startedAt) / 60000);
    $('doneText').textContent = `${cfg.rounds} ${cfg.rounds === 1 ? 'Runde' : 'Runden'} × ${cfg.exercises} Übungen · ${mins} min`;
    show('done');
  }

  $('startBtn').addEventListener('click', start);
  $('pauseBtn').addEventListener('click', togglePause);
  $('skipBtn').addEventListener('click', skip);
  $('stopBtn').addEventListener('click', stopTap);
  $('backBtn').addEventListener('click', () => { player.pause(); show('setup'); });
})();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
<style>
#done {
  position: fixed; inset: 0; z-index: 5; background: var(--rest); color: var(--on-phase);
  display: flex; flex-direction: column;
  padding-top: calc(env(safe-area-inset-top, 0px) + 16px);
  padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 20px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#done[hidden] { display: none; }
</style>

</body>
</html>
